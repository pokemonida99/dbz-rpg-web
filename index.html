<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>龍珠Z RPG 網頁版</title>
<!-- GitHub Pages can't send COOP/COEP headers; this service worker adds them (SharedArrayBuffer needs them) -->
<script>
  // Safari doesn't support COEP "credentialless" (coi-serviceworker's default outside Chrome/Firefox);
  // every resource is same-origin, so "require-corp" works everywhere.
  window.coi = { coepCredentialless: () => false };
</script>
<script src="coi-serviceworker.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: system-ui, sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #screen { width: min(100vw, calc(100vh * 4 / 3)); aspect-ratio: 4 / 3; image-rendering: pixelated; background: #000; }
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 18px; }
  #error { position: fixed; inset: 16px; overflow: auto; background: rgba(60,0,0,.92); color: #fdd; padding: 16px; white-space: pre-wrap; font: 13px/1.4 ui-monospace, monospace; }
  #bar { position: fixed; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 5; }
  #bar button { font: 13px system-ui, sans-serif; color: #eee; background: rgba(30,30,40,.75); border: 1px solid #556; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  #bar button:hover { background: rgba(60,60,80,.9); }
  #bar button.on { border-color: #e8a33c; color: #ffd27a; }
  #bar kbd { opacity: .6; font-size: 11px; margin-left: 4px; }
  #panel { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #panel[hidden] { display: none; }
  #panel .box { background: #f6d7a0; color: #222; border: 4px solid #c8642a; border-radius: 6px; padding: 14px 16px; width: min(92vw, 440px); font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  #panel h2 { margin: 0 0 10px; font-size: 18px; }
  #panel .slot { display: grid; grid-template-columns: 24px 1fr; gap: 0 8px; width: 100%; text-align: left; background: transparent; border: 2px solid transparent; border-radius: 4px; padding: 5px 6px; margin: 2px 0; cursor: pointer; font: inherit; color: inherit; }
  #panel .slot b { grid-row: span 2; font-size: 18px; align-self: center; }
  #panel .slot small { color: #6a4a24; min-height: 1em; }
  #panel .slot.sel, #panel .slot:hover { border-color: #c8642a; background: #fbe6bf; }
  #panel .hint { margin: 8px 0 0; font-size: 12px; color: #6a4a24; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(0,0,0,.85); border: 1px solid #555; padding: 8px 14px; border-radius: 6px; white-space: pre-wrap; max-width: 80vw; }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="640" height="480"></canvas></div>
<div id="bar">
  <button id="btn-save" title="隨時存檔">存檔<kbd>F2</kbd></button>
  <button id="btn-load" title="隨時讀檔">讀檔<kbd>F4</kbd></button>
  <button id="btn-speed" title="戰鬥時加快兩倍">戰鬥 2×<kbd>F8</kbd></button>
</div>
<div id="panel" hidden></div>
<div id="status">載入中…</div>
<pre id="error" hidden></pre>
<script type="module" src="js/main.js"></script>
</body>
</html>
